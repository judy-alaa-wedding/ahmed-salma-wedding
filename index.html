<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahmed & Salma's Wedding</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f0e6;
  font-family: Georgia, serif;
}

#intro {
  position: fixed;
  inset: 0;
  background: #21090e;
  z-index: 100;
  display: flex;
  justify-content: center;
  align-items: center;
}

#intro video {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

#openBtn {
  position: absolute;
  bottom: 8%;
  left: 50%;
  transform: translateX(-50%);
  padding: 14px 22px;
  border: 1px solid #d6b99a;
  border-radius: 30px;
  background: #fff8ee;
  color: #65232d;
  font-family: Georgia, serif;
  cursor: pointer;
  white-space: nowrap;
}

#invitation {
  display: none;
  max-width: 600px;
  margin: auto;
}

.page {
  position: relative;
  width: 100%;
  line-height: 0;
}

.page img {
  width: 100%;
  height: auto;
  display: block;
}

#countdown {
  position: absolute;
  top: 61%;
  left: 50%;
  transform: translateX(-50%);
  width: 78%;
  padding: 12px 5px;
  background: rgba(255,255,255,0.95);
  color: #65232d;
  border-radius: 12px;
  text-align: center;
  line-height: 1.5;
  font-size: clamp(12px, 3vw, 19px);
}

#locationBtn {
  position: absolute;
  left: 25%;
  bottom: 5%;
  width: 50%;
  height: 11%;
  z-index: 5;
}
</style>
</head>

<body>

<div id="intro">
  <video id="openingVideo" playsinline preload="auto">
    <source src="Ahmed%20%26%20Salma%27s%20Wedding.mp4" type="video/mp4">
  </video>

  <button id="openBtn">💌 Open Invitation</button>
</div>

<main id="invitation">

  <div class="page">
    <img src="2.jpg" alt="Ahmed and Salma">
  </div>

  <div class="page">
    <img src="3.jpg" alt="Wedding Invitation">
  </div>

  <div class="page">
    <img src="4.jpg" alt="Save the Date">
  </div>

  <div class="page">
    <img src="5.jpg" alt="Wedding Countdown">

    <div id="countdown">
      <div>Counting down to our special day</div>
      <div id="timer"></div>
    </div>
  </div>

  <div class="page">
    <img src="6.jpg" alt="Wedding Location">

    <a id="locationBtn"
       href="https://maps.app.goo.gl/6b3BnmGwQUt3JVhy7"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Open Location">
    </a>
  </div>

</main>

<script>
const video = document.getElementById("openingVideo");
const intro = document.getElementById("intro");
const invitation = document.getElementById("invitation");
const openBtn = document.getElementById("openBtn");

function showInvitation() {
  video.pause();
  intro.style.display = "none";
  invitation.style.display = "block";
}

openBtn.addEventListener("click", function() {
  openBtn.style.display = "none";

  video.currentTime = 0;

  video.play().catch(function() {
    showInvitation();
  });
});

video.addEventListener("ended", showInvitation);

video.addEventListener("error", showInvitation);

const weddingDate = new Date("2026-11-27T19:00:00+02:00").getTime();

function updateCountdown() {
  const difference = Math.max(0, weddingDate - Date.now());

  const days = Math.floor(difference / 86400000);
  const hours = Math.floor((difference / 3600000) % 24);
  const minutes = Math.floor((difference / 60000) % 60);
  const seconds = Math.floor((difference / 1000) % 60);

  document.getElementById("timer").textContent =
    days + " Days : " +
    hours + " Hours : " +
    minutes + " Minutes : " +
    seconds + " Seconds";
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>

</body>
</html>
